<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — OpenBOQ</title>
<!-- Su presencia también hace que el alojamiento devuelva 404 real en los archivos
     que faltan, en vez de servir index.html con estado 200. De eso dependen los
     onerror del catálogo en index.html. -->
<style>
  body { font: 16px/1.6 system-ui, "Segoe UI", sans-serif; color: #1f2328; background: #f6f8fa;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 3rem; margin: 0; color: #57606a; }
  p { color: #57606a; }
  a { color: #0969da; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    h1, p { color: #8d96a0; }
    a { color: #4493f8; }
  }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Esta dirección no existe en OpenBOQ.</p>
  <p><a href="/">Ir a la aplicación</a></p>
</main>
</body>
</html>
